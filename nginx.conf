# Nginx 配置片段 — 智能问答平台
# 添加到现有 server {} 块中，与已有 location /api/ 和 location / 并列
#
# 访问地址: http://sunlingyue.cn/chat/
# 路径规则:
#   /chat/        → 问答平台首页
#   /chat/api/*   → 问答平台后端 API（不影响现有 /api/）
#   /api/         → 现有服务（3001，不变）
#   /             → 现有服务（3000，不变）

# ── 把这段 location 块插入你现有的 server{} 里 ──

    # 问答平台 — 主页面（/chat 和 /chat/ 均可访问）
    location = /chat {
        return 301 /chat/;
    }

    location /chat/ {
        # 去掉 /chat 前缀后转发给 FastAPI（运行在 8000）
        rewrite ^/chat(/.*)$ $1 break;

        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE 流式输出必须关闭缓冲
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     300s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     300s;

        # 支持最大 25MB 文件上传
        client_max_body_size   25M;
    }

# ── 保留你原有的两个 location 不动 ──

    # location /api/ {
    #   proxy_pass http://127.0.0.1:3001;
    #   ...
    # }

