<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LingyueSeek</title>

  <!-- Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <!-- Code syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- KaTeX for math (optional, gracefully degrades) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<style>
/* ===== CSS Reset & Variables ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── 结构变量（不随主题变化）── */
:root {
  --sidebar-width: 260px;
  --content-width: 900px;
  --radius:        10px;
  --radius-sm:     6px;
  --font-sans:     -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono:     "JetBrains Mono", "Fira Code", Consolas, monospace;
  --transition:    0.18s ease;
}

/* ── Dark 主题（默认）── */
:root, [data-theme="dark"] {
  --bg-primary:    #0f0f10;
  --bg-secondary:  #18181b;
  --bg-hover:      #27272a;
  --bg-active:     #3f3f46;
  --border:        #27272a;
  --text-primary:  #f4f4f5;
  --text-secondary:#a1a1aa;
  --text-muted:    #71717a;
  --accent:        #6366f1;
  --accent-hover:  #4f46e5;
  --accent-light:  rgba(99,102,241,0.15);
  --danger:        #ef4444;
  --success:       #22c55e;
  --warning:       #f59e0b;
  --shadow:        0 4px 24px rgba(0,0,0,0.4);
}

/* ── Light 主题 ── */
[data-theme="light"] {
  --bg-primary:    #f4f4f5;
  --bg-secondary:  #ffffff;
  --bg-hover:      #e4e4e7;
  --bg-active:     #d4d4d8;
  --border:        #e4e4e7;
  --text-primary:  #18181b;
  --text-secondary:#52525b;
  --text-muted:    #a1a1aa;
  --accent:        #6366f1;
  --accent-hover:  #4f46e5;
  --accent-light:  rgba(99,102,241,0.12);
  --danger:        #dc2626;
  --success:       #16a34a;
  --warning:       #d97706;
  --shadow:        0 4px 24px rgba(0,0,0,0.1);
}

/* ── 兼容旧 :root 写法（--transition 已移到 :root）── */
:root {
  --transition:    0.18s ease;
}

body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100dvh;
  display: flex;
  overflow: hidden;
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-active); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ===== Sidebar ===== */
.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width 0.22s ease, border-color 0.22s ease;
  z-index: 10;
  position: relative;   /* 让 resizer 定位正确 */
  overflow: visible;    /* resizer 需要溢出 */
  min-width: 0;
}
.sidebar.collapsed {
  width: 0 !important;
  border-right-color: transparent;
  overflow: hidden;
}

/* 拖拽手柄 */
.sidebar-resizer {
  position: absolute;
  right: -4px; top: 0; bottom: 0;
  width: 8px;
  cursor: ew-resize;
  z-index: 30;
  border-radius: 4px;
  transition: background 0.15s;
}
.sidebar-resizer:hover,
.sidebar-resizer.dragging { background: var(--accent); opacity: 0.6; }

/* 折叠按钮 & 主题按钮（sidebar header 右侧） */
.sidebar-icon-btn {
  background: none; border: none;
  color: var(--text-muted); cursor: pointer;
  padding: 4px; border-radius: var(--radius-sm);
  display: flex; align-items: center;
  transition: color var(--transition), background var(--transition);
  flex-shrink: 0;
}
.sidebar-icon-btn:hover { color: var(--text-primary); background: var(--bg-hover); }

/* 展开侧栏 FAB（侧栏收起后显示）*/
.sidebar-expand-fab {
  display: none;
  position: fixed; left: 12px; top: 12px;
  z-index: 200;
  background: var(--accent); border: none; color: white;
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  align-items: center; justify-content: center;
  cursor: pointer; box-shadow: var(--shadow);
  transition: background var(--transition);
}
.sidebar-expand-fab:hover { background: var(--accent-hover); }
.sidebar-expand-fab.visible { display: flex; }

/* 主题选择器 */
.theme-picker-wrap { position: relative; }
.theme-picker {
  display: none; position: absolute;
  top: calc(100% + 6px); right: 0;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius); padding: 6px;
  z-index: 300; box-shadow: var(--shadow);
  min-width: 130px; flex-direction: column; gap: 2px;
}
.theme-picker.open { display: flex; }
.theme-option {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: var(--radius-sm);
  cursor: pointer; font-size: 12px;
  color: var(--text-secondary);
  border: none; background: none; width: 100%; text-align: left;
  transition: background var(--transition), color var(--transition);
}
.theme-option:hover { background: var(--bg-hover); color: var(--text-primary); }
.theme-option.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
.theme-swatch {
  width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid rgba(128,128,128,0.3);
}

.sidebar-header {
  padding: 16px 14px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.3px;
  color: var(--text-primary);
  text-decoration: none;
}

.logo-icon {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}

.btn-new-chat {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 12px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background var(--transition);
  width: 100%;
  justify-content: center;
}
.btn-new-chat:hover { background: var(--accent-hover); }
.btn-new-chat svg { flex-shrink: 0; }

/* Chat history */
.chat-history-section {
  flex: 1;
  overflow-y: auto;
  padding: 8px 8px 4px;
}

.history-group-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  padding: 8px 6px 4px;
}

.history-item {
  display: flex;
  align-items: center;
  padding: 7px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  gap: 7px;
  transition: background var(--transition);
  position: relative;
  min-height: 34px;
}
.history-item:hover { background: var(--bg-hover); }
.history-item.active { background: var(--bg-active); }
.history-item-title {
  font-size: 13px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.history-item.active .history-item-title { color: var(--text-primary); }
.history-item-delete {
  opacity: 0;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 2px;
  border-radius: 3px;
  display: flex;
  align-items: center;
  transition: opacity var(--transition), color var(--transition);
  flex-shrink: 0;
}
.history-item:hover .history-item-delete { opacity: 1; }
.history-item-delete:hover { color: var(--danger); }

/* Documents section */
.docs-section {
  border-top: 1px solid var(--border);
  padding: 10px 8px 8px;
}

.docs-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 4px 8px;
}

.docs-section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 5px;
}

.docs-badge {
  background: var(--accent);
  color: white;
  font-size: 9px;
  font-weight: 700;
  border-radius: 99px;
  padding: 1px 5px;
  min-width: 16px;
  text-align: center;
}

.btn-upload {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  background: var(--accent-light);
  color: var(--accent);
  border: 1px solid rgba(99,102,241,0.3);
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
}
.btn-upload:hover { background: var(--accent); color: white; border-color: var(--accent); }

.doc-list { display: flex; flex-direction: column; gap: 3px; max-height: 180px; overflow-y: auto; }

.doc-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 6px;
  border-radius: var(--radius-sm);
  background: var(--bg-hover);
  font-size: 12px;
  color: var(--text-secondary);
}
.doc-icon { font-size: 13px; flex-shrink: 0; }
.doc-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-chunks { font-size: 10px; color: var(--text-muted); flex-shrink: 0; }
.doc-emb-badge {
  font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 3px;
  flex-shrink: 0;
}
.doc-emb-badge.ok      { background: rgba(34,197,94,0.15); color: var(--success); }
.doc-emb-badge.no      { background: rgba(245,158,11,0.15); color: var(--warning); }
.doc-emb-badge.loading { background: rgba(99,102,241,0.15); color: var(--accent);
                         animation: embedPulse 1.2s ease-in-out infinite; }
@keyframes embedPulse { 0%,100% { opacity:1; } 50% { opacity:0.35; } }
.doc-re-embed {
  background: none; border: none;
  color: var(--text-muted);
  cursor: pointer; padding: 1px; border-radius: 3px;
  display: flex; align-items: center;
  opacity: 0; transition: opacity var(--transition);
  title: "重新向量化";
}
.doc-item:hover .doc-re-embed { opacity: 1; }
.doc-re-embed:hover { color: var(--accent); }
.doc-delete {
  background: none; border: none;
  color: var(--text-muted);
  cursor: pointer; padding: 1px; border-radius: 3px;
  display: flex; align-items: center;
  opacity: 0; transition: opacity var(--transition);
}
.doc-item:hover .doc-delete { opacity: 1; }
.doc-delete:hover { color: var(--danger); }

.rag-toggle {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 6px 0;
  font-size: 12px; color: var(--text-secondary);
  cursor: pointer;
  user-select: none;
}
.rag-toggle input { accent-color: var(--accent); cursor: pointer; }

/* Upload progress indicator */
.upload-progress {
  display: none;
  padding: 4px 6px;
  font-size: 11px;
  color: var(--accent);
  background: var(--accent-light);
  border-radius: var(--radius-sm);
  text-align: center;
}
.upload-progress.visible { display: block; }

/* ===== Main area ===== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
}

/* ===== Chat messages ===== */
.messages-container {
  flex: 1;
  overflow-y: auto;
  padding: 0;
  scroll-behavior: smooth;
  position: relative;
}

.messages-inner {
  max-width: var(--content-width);
  margin: 0 auto;
  padding: 24px 20px 8px;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* Welcome screen */
.welcome {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 16px;
  padding: 32px 16px;
  pointer-events: auto;
}
.welcome-icon {
  width: 56px; height: 56px;
  background: var(--accent);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  box-shadow: 0 8px 32px rgba(99,102,241,0.3);
}
.welcome h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.welcome p { font-size: 14px; color: var(--text-secondary); max-width: 380px; line-height: 1.6; }

.suggestion-chips {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; margin-top: 8px;
}
.chip {
  padding: 7px 14px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 99px;
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition);
}
.chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

/* ===== Message bubbles ===== */
.message {
  display: flex;
  gap: 12px;
  padding: 14px 0;
  animation: fadeSlideIn 0.22s ease;
  position: relative;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.message.user { flex-direction: row-reverse; }

.avatar {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  align-self: flex-start;
  margin-top: 2px;
}
.message.user .avatar { background: var(--accent); }
.message.assistant .avatar { background: var(--bg-hover); border: 1px solid var(--border); }

.bubble {
  flex: 1;
  min-width: 0;
  max-width: 85%;
}
.message.user .bubble { text-align: right; }

.bubble-content {
  display: inline-block;
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 14px;
  line-height: 1.65;
  text-align: left;
  position: relative;
  max-width: 100%;
  word-break: break-word;
}

.message.user .bubble-content {
  background: var(--accent);
  color: white;
  border-radius: var(--radius) var(--radius) 4px var(--radius);
}

.message.assistant .bubble-content {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius) var(--radius) var(--radius) 4px;
  width: 100%;
}

/* ===== Markdown styles inside bubbles ===== */
.bubble-content h1, .bubble-content h2, .bubble-content h3,
.bubble-content h4, .bubble-content h5, .bubble-content h6 {
  margin: 1em 0 0.4em;
  font-weight: 600;
  line-height: 1.3;
}
.bubble-content h1 { font-size: 1.3em; }
.bubble-content h2 { font-size: 1.15em; }
.bubble-content h3 { font-size: 1.05em; }

.bubble-content p { margin: 0.5em 0; }
.bubble-content p:first-child { margin-top: 0; }
.bubble-content p:last-child { margin-bottom: 0; }

.bubble-content ul, .bubble-content ol {
  margin: 0.5em 0;
  padding-left: 1.4em;
}
.bubble-content li { margin: 0.2em 0; }

.bubble-content blockquote {
  border-left: 3px solid var(--accent);
  margin: 0.6em 0;
  padding: 4px 12px;
  color: var(--text-secondary);
  font-style: italic;
}

.bubble-content hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 0.8em 0;
}

.bubble-content table {
  border-collapse: collapse;
  width: 100%;
  margin: 0.6em 0;
  font-size: 13px;
}
.bubble-content th, .bubble-content td {
  border: 1px solid var(--border);
  padding: 5px 10px;
}
.bubble-content th { background: var(--bg-hover); font-weight: 600; }
.bubble-content tr:nth-child(even) { background: rgba(255,255,255,0.02); }

/* Inline code */
.bubble-content code:not([class]) {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 1px 5px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 0.88em;
}

/* Code blocks */
.bubble-content pre {
  margin: 0;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  overflow: hidden;
}

.code-block-wrapper {
  position: relative;
  margin: 0.7em 0;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
}

.code-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  background: rgba(0,0,0,0.35);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-muted);
}

.code-copy-btn {
  background: none;
  border: 1px solid rgba(255,255,255,0.15);
  color: var(--text-muted);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  transition: all var(--transition);
  font-family: var(--font-sans);
}
.code-copy-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
.code-copy-btn.copied { color: var(--success); border-color: var(--success); }

.bubble-content pre code {
  font-family: var(--font-mono) !important;
  font-size: 13px !important;
  line-height: 1.55;
  display: block;
  padding: 12px 14px !important;
  overflow-x: auto;
  background: transparent !important;
}

/* Streaming cursor */
.cursor {
  display: inline-block;
  width: 2px; height: 1em;
  background: var(--accent);
  margin-left: 2px;
  vertical-align: text-bottom;
  border-radius: 1px;
  animation: blink 0.9s ease-in-out infinite;
}
@keyframes blink {
  0%, 45% { opacity: 1; }
  55%, 100% { opacity: 0; }
}

/* Thinking indicator */
.thinking-indicator {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  color: var(--text-secondary);
  font-size: 13px;
}
.thinking-dots {
  display: flex;
  gap: 4px;
  align-items: center;
}
.thinking-dots span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: thinking-bounce 1.2s ease-in-out infinite;
}
.thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
.thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes thinking-bounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40%           { transform: scale(1);   opacity: 1;   }
}

/* Message actions */
.message-actions {
  display: flex;
  gap: 4px;
  margin-top: 5px;
  opacity: 0;
  transition: opacity var(--transition);
}
.message:hover .message-actions { opacity: 1; }
.message.user .message-actions { justify-content: flex-end; }

.action-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 3px 7px;
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  transition: all var(--transition);
}
.action-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.action-btn.copied { color: var(--success); border-color: var(--success); }

/* Timestamp */
.message-time {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 3px;
  display: block;
}
.message.user .message-time { text-align: right; }

/* ===== Input area ===== */
.input-area {
  padding: 12px 20px 16px;
  background: var(--bg-primary);
  border-top: 1px solid var(--border);
}

.input-inner {
  max-width: var(--content-width);
  margin: 0 auto;
}

.input-box {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  transition: border-color var(--transition), box-shadow var(--transition);
  overflow: hidden;
}
.input-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
}

.input-row {
  display: flex;
  align-items: flex-end;
  padding: 4px 4px 4px 12px;
  gap: 6px;
}

textarea#chat-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.6;
  resize: none;
  padding: 8px 0;
  min-height: 42px;
  max-height: 200px;
  overflow-y: auto;
}
textarea#chat-input::placeholder { color: var(--text-muted); }

.send-btn {
  width: 36px; height: 36px;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background var(--transition), transform var(--transition);
  flex-shrink: 0;
  align-self: flex-end;
  margin-bottom: 4px;
}
.send-btn:hover:not(:disabled) { background: var(--accent-hover); }
.send-btn:active:not(:disabled) { transform: scale(0.93); }
.send-btn:disabled { background: var(--bg-active); cursor: not-allowed; opacity: 0.5; }
.send-btn svg { pointer-events: none; }

.stop-btn {
  background: var(--danger) !important;
}
.stop-btn:hover:not(:disabled) { background: #dc2626 !important; }

.input-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 12px 8px;
  font-size: 11px;
  color: var(--text-muted);
}

.model-badge {
  display: flex; align-items: center; gap: 4px;
  padding: 2px 7px;
  background: var(--bg-hover);
  border-radius: 99px;
  font-size: 11px;
  color: var(--text-secondary);
}
.model-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--success);
  animation: pulse 2s ease infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.4; }
}

.shortcut-hint { color: var(--text-muted); }

/* ===== Toast notifications ===== */
.toast-container {
  position: fixed;
  top: 16px; right: 16px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  color: white;
  box-shadow: var(--shadow);
  animation: toastIn 0.25s ease;
  max-width: 320px;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px); }
  to   { opacity: 1; transform: translateX(0); }
}
.toast.success { background: var(--success); }
.toast.error   { background: var(--danger); }
.toast.info    { background: var(--accent); }
.toast.warning { background: var(--warning); color: #1a1a1a; }

/* ===== Drag-over overlay ===== */
.drop-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(99,102,241,0.18);
  border: 3px dashed var(--accent);
  z-index: 999;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 600;
  color: var(--accent);
  gap: 12px;
  pointer-events: none;
}
.drop-overlay.active { display: flex; }

/* ===== Mobile ===== */
.mobile-menu-btn {
  display: none;
  position: fixed;
  top: 12px; left: 12px;
  z-index: 100;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  color: var(--text-primary);
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  align-items: center; justify-content: center;
  cursor: pointer;
}

@media (max-width: 640px) {
  .mobile-menu-btn { display: flex; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0;
    transform: translateX(-100%);
    width: 280px;
  }
  .sidebar.open { transform: translateX(0); box-shadow: var(--shadow); }
  .messages-inner { padding: 56px 12px 8px; }
  .input-area { padding: 8px 12px 12px; }
}

/* Error state */
.error-bubble {
  background: rgba(239,68,68,0.1) !important;
  border-color: rgba(239,68,68,0.3) !important;
  color: #fca5a5;
}
</style>

<script>
// ============================================================
// Configuration
// ============================================================
const API_BASE = '/chat';   // 部署在 /chat/ 子路径下

// ============================================================
// State
// ============================================================
const state = {
  chats: [],          // [{id, title, messages:[{role,content,time}]}]
  activeChatId: null,
  isStreaming: false,
  documents: [],      // from server
  apiSources: [],     // API数据源列表
  abortController: null,
  embeddingDocs: new Set(),  // doc_ids 正在后台向量化
  embedPollTimer: null,      // 轮询定时器
};

// ============================================================
// Marked.js setup
// ============================================================
marked.setOptions({
  breaks: true,
  gfm: true,
  highlight: null,  // we handle highlight manually
});

// Custom renderer: wrap code blocks with header + copy button
const renderer = new marked.Renderer();
renderer.code = function(code, lang) {
  const safeCode = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const langLabel = lang || 'plaintext';
  const highlighted = (hljs && lang && hljs.getLanguage(lang))
    ? hljs.highlight(code, {language: lang, ignoreIllegals: true}).value
    : hljs ? hljs.highlightAuto(code).value : safeCode;

  return `<div class="code-block-wrapper"><div class="code-header"><span>${langLabel}</span><button class="code-copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code class="hljs language-${langLabel}">${highlighted}</code></pre></div>`;
};
marked.use({ renderer });

// ============================================================
// Utility functions
// ============================================================
function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function formatTime(ts) {
  return new Date(ts).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(message, type = 'info', duration = 3500) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = message;
  c.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(20px)';
    t.style.transition = 'all 0.3s ease';
    setTimeout(() => t.remove(), 300);
  }, duration);
}

function autoResizeTextarea(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}

// ============================================================
// Local storage helpers
// ============================================================
function saveChats() {
  try {
    localStorage.setItem('qa-chats', JSON.stringify(state.chats));
    localStorage.setItem('qa-active', state.activeChatId || '');
  } catch(e) { /* storage full */ }
}

function loadChats() {
  try {
    const raw = localStorage.getItem('qa-chats');
    if (raw) state.chats = JSON.parse(raw);
    state.activeChatId = localStorage.getItem('qa-active') || null;
  } catch(e) { state.chats = []; }
}

// ============================================================
// Chat management
// ============================================================
function createNewChat() {
  const chat = {
    id: generateId(),
    title: '新对话',
    messages: [],
    createdAt: Date.now(),
  };
  state.chats.unshift(chat);
  state.activeChatId = chat.id;
  saveChats();
  renderSidebar();
  renderMessages();
  document.getElementById('chat-input').focus();
}

function switchChat(chatId) {
  if (state.isStreaming) return;
  state.activeChatId = chatId;
  saveChats();
  renderSidebar();
  renderMessages();
}

function deleteChat(chatId, e) {
  e.stopPropagation();
  state.chats = state.chats.filter(c => c.id !== chatId);
  if (state.activeChatId === chatId) {
    state.activeChatId = state.chats[0]?.id || null;
  }
  saveChats();
  renderSidebar();
  renderMessages();
}

function getActiveChat() {
  return state.chats.find(c => c.id === state.activeChatId) || null;
}

function updateChatTitle(chat, firstUserMessage) {
  if (chat.title === '新对话') {
    chat.title = firstUserMessage.slice(0, 46) + (firstUserMessage.length > 46 ? '…' : '');
    saveChats();
    renderSidebar();
  }
}

// ============================================================
// Render sidebar
// ============================================================
function renderSidebar() {
  const container = document.getElementById('chat-history');

  if (state.chats.length === 0) {
    container.innerHTML = `<div style="padding:16px 8px;font-size:12px;color:var(--text-muted);text-align:center;">暂无对话</div>`;
    return;
  }

  // Group by today / yesterday / older
  const now = Date.now();
  const DAY = 86400000;
  const groups = {today: [], yesterday: [], older: []};

  for (const chat of state.chats) {
    const age = now - (chat.createdAt || 0);
    if (age < DAY) groups.today.push(chat);
    else if (age < 2 * DAY) groups.yesterday.push(chat);
    else groups.older.push(chat);
  }

  let html = '';
  const renderGroup = (label, chats) => {
    if (!chats.length) return;
    html += `<div class="history-group-label">${label}</div>`;
    for (const chat of chats) {
      const active = chat.id === state.activeChatId ? ' active' : '';
      html += `
        <div class="history-item${active}" onclick="switchChat('${chat.id}')">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" style="flex-shrink:0;color:var(--text-muted)">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span class="history-item-title">${escapeHtml(chat.title)}</span>
          <button class="history-item-delete" onclick="deleteChat('${chat.id}',event)" title="Delete">
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>`;
    }
  };
  renderGroup('今天', groups.today);
  renderGroup('昨天', groups.yesterday);
  renderGroup('更早', groups.older);

  container.innerHTML = html;
}

// ============================================================
// Render messages
// ============================================================
function renderMessages() {
  const inner = document.getElementById('messages-inner');
  const chat = getActiveChat();
  const w = document.getElementById('welcome-screen');

  // 始终通过 getElementById 获取 welcome，避免引用断裂
  const showWelcome = () => {
    inner.innerHTML = '';
    if (w) w.style.display = 'flex';
  };

  if (!chat || chat.messages.length === 0) {
    showWelcome();
    return;
  }

  if (w) w.style.display = 'none';
  inner.innerHTML = '';

  for (const msg of chat.messages) {
    // 跳过流式过程中 content 为空的 assistant 占位（还在流式中，不需要渲染）
    if (msg.role === 'assistant' && !msg.content) continue;
    inner.appendChild(buildMessageEl(msg));
  }

  scrollToBottom(false);
}

function buildMessageEl(msg) {
  const div = document.createElement('div');
  div.className = `message ${msg.role}`;
  div.dataset.msgId = msg.id;

  const isUser = msg.role === 'user';
  const avatarEmoji = isUser ? '👤' : '🤖';
  const timeStr = msg.time ? formatTime(msg.time) : '';

  let contentHtml;
  if (isUser) {
    contentHtml = escapeHtml(msg.content).replace(/\n/g, '<br>');
  } else {
    contentHtml = marked.parse(msg.content || '');
  }

  div.innerHTML = `
    <div class="avatar">${avatarEmoji}</div>
    <div class="bubble">
      <div class="bubble-content${msg.error ? ' error-bubble' : ''}">${contentHtml}</div>
      <div class="message-actions">
        <button class="action-btn" onclick="copyMessage(this, '${escapeHtml(msg.id)}')">
          <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Copy
        </button>
        ${!isUser ? `<button class="action-btn" onclick="regenerate('${escapeHtml(msg.id)}')">
          <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 .49-4.09"/>
          </svg>
          重试
        </button>` : ''}
      </div>
      ${timeStr ? `<span class="message-time">${timeStr}</span>` : ''}
    </div>`;

  return div;
}

function scrollToBottom(smooth = true) {
  const c = document.getElementById('messages-container');
  c.scrollTo({top: c.scrollHeight, behavior: smooth ? 'smooth' : 'instant'});
}

// ============================================================
// Copy helpers
// ============================================================
function copyCode(btn) {
  const code = btn.closest('.code-block-wrapper').querySelector('code');
  navigator.clipboard.writeText(code.textContent).then(() => {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
}

function copyMessage(btn, msgId) {
  const chat = getActiveChat();
  if (!chat) return;
  const msg = chat.messages.find(m => m.id === msgId);
  if (!msg) return;
  navigator.clipboard.writeText(msg.content).then(() => {
    const originalHTML = btn.innerHTML;
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = originalHTML; btn.classList.remove('copied'); }, 2000);
  });
}

function regenerate(msgId) {
  const chat = getActiveChat();
  if (!chat) return;
  const idx = chat.messages.findIndex(m => m.id === msgId);
  if (idx < 0) return;
  // Remove from this assistant message onward and re-send
  const prevUserMsg = chat.messages.slice(0, idx).reverse().find(m => m.role === 'user');
  chat.messages = chat.messages.slice(0, idx);
  saveChats();
  renderMessages();
  if (prevUserMsg) sendMessage(null, prevUserMsg.content);
}

// ============================================================
// Send message
// ============================================================
async function sendMessage(e, forcedContent = null) {
  if (state.isStreaming && !forcedContent) return;

  const input = document.getElementById('chat-input');
  const content = (forcedContent || input.value).trim();
  if (!content) return;

  // Ensure we have an active chat
  if (!state.activeChatId) {
    createNewChat();
  }
  const chat = getActiveChat();
  if (!chat) return;

  input.value = '';
  autoResizeTextarea(input);
  updateSendButton(true);

  // Hide welcome
  const welcomeEl = document.getElementById('welcome-screen');
  if (welcomeEl) welcomeEl.style.display = 'none';

  // Add user message
  const userMsg = {id: generateId(), role: 'user', content, time: Date.now()};
  chat.messages.push(userMsg);
  updateChatTitle(chat, content);

  const userEl = buildMessageEl(userMsg);
  document.getElementById('messages-inner').appendChild(userEl);
  scrollToBottom();

  // Add placeholder assistant message
  const assistantMsgId = generateId();
  const assistantMsg = {id: assistantMsgId, role: 'assistant', content: '', time: Date.now()};
  chat.messages.push(assistantMsg);

  const assistantEl = buildMessageEl(assistantMsg);
  const bubbleContent = assistantEl.querySelector('.bubble-content');

  // ── Thinking indicator（等待第一个 token 时显示）──
  const thinkingEl = document.createElement('div');
  thinkingEl.className = 'thinking-indicator';
  thinkingEl.innerHTML = `
    <div class="thinking-dots">
      <span></span><span></span><span></span>
    </div>
    <span>思考中…</span>`;
  bubbleContent.appendChild(thinkingEl);

  document.getElementById('messages-inner').appendChild(assistantEl);
  scrollToBottom();

  // Build API messages (exclude empty placeholder)
  const apiMessages = chat.messages
    .filter(m => !(m.id === assistantMsgId))
    .map(m => ({role: m.role, content: m.content}));

  const useRag = document.getElementById('rag-toggle').checked;

  // Streaming fetch
  state.isStreaming = true;
  state.abortController = new AbortController();

  let fullText = '';
  let firstToken = true;  // 收到第一个 token 后移除 thinking，开始渲染

  // 流式 Markdown 实时渲染：节流 80ms（≈12fps），避免每个 token 都触发 DOM 重绘
  let renderTimer = null;

  function renderMarkdown() {
    renderTimer = null;
    bubbleContent.innerHTML = marked.parse(fullText);
    // 在渲染结果末尾追加闪烁光标
    const cur = document.createElement('span');
    cur.className = 'cursor';
    bubbleContent.appendChild(cur);
    scrollToBottom();
  }

  function scheduleRender() {
    if (renderTimer) return;
    renderTimer = setTimeout(renderMarkdown, 80);
  }

  try {
    const resp = await fetch(`${API_BASE}/api/chat`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages: apiMessages, use_rag: useRag}),
      signal: state.abortController.signal,
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({detail: resp.statusText}));
      throw new Error(err.detail || `HTTP ${resp.status}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop(); // keep partial line

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          if (data.type === 'text') {
            // 收到第一个 token：移除 thinking，直接开始 Markdown 渲染
            if (firstToken) {
              firstToken = false;
              thinkingEl.remove();
            }
            fullText += data.text;
            scheduleRender();
          } else if (data.type === 'error') {
            throw new Error(data.message);
          }
        } catch (parseErr) {
          if (parseErr.message && parseErr.message !== 'Unexpected end of JSON input') {
            throw parseErr;
          }
        }
      }
    }

    // 流结束：清除节流定时器，做最终完整渲染（去掉光标）
    if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
    bubbleContent.innerHTML = marked.parse(fullText || '（无响应）');
    assistantMsg.content = fullText;

  } catch (err) {
    if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
    thinkingEl.remove();
    if (err.name === 'AbortError') {
      // 用户手动停止：保留已接收内容
      bubbleContent.innerHTML = marked.parse(fullText || '');
      assistantMsg.content = fullText;
    } else {
      const errText = `❌ **错误：** ${err.message}`;
      bubbleContent.innerHTML = marked.parse(errText);
      bubbleContent.classList.add('error-bubble');
      assistantMsg.content = errText;
      assistantMsg.error = true;
      showToast(err.message, 'error', 5000);
    }
  } finally {
    state.isStreaming = false;
    state.abortController = null;
    updateSendButton(false);
    saveChats();
    renderSidebar(); // update title if changed
    scrollToBottom();
  }
}

function stopStreaming() {
  if (state.abortController) {
    state.abortController.abort();
  }
}

function updateSendButton(streaming) {
  const btn = document.getElementById('send-btn');

  if (streaming) {

async function loadDocuments() {
  try {
    const resp = await fetch(`${API_BASE}/api/documents`);
    if (!resp.ok) return;
    const data = await resp.json();
    state.documents = data.documents || [];

    // 修正：拿到最新列表后，将已完成向量化的 doc 从 embeddingDocs 中移除，
    // 避免页面刷新后"卡在向量化中"的问题（子进程可能在刷新前已经完成）
    let anyCleared = false;
    for (const doc of state.documents) {
      if (state.embeddingDocs.has(doc.doc_id) && doc.has_embeddings) {
        state.embeddingDocs.delete(doc.doc_id);
        anyCleared = true;
      }
    }
    if (anyCleared) saveEmbeddingDocs();

    renderDocList();
  } catch (e) { /* offline, ignore */ }
}

function renderDocList() {
  const list = document.getElementById('doc-list');
  const badge = document.getElementById('docs-badge');
  badge.textContent = state.documents.length;

  if (state.documents.length === 0) {
    list.innerHTML = `<div style="font-size:11px;color:var(--text-muted);padding:4px 4px 2px;text-align:center;">暂无文档，点击"添加文档"上传</div>`;
    return;
  }

  const icons = {pdf: '📄', txt: '📝', md: '📋', xlsx: '📊', xls: '📊'};
  list.innerHTML = state.documents.map(doc => {
    const isEmbedding = state.embeddingDocs.has(doc.doc_id);
    const embBadge = isEmbedding
      ? `<span class="doc-emb-badge loading" title="向量化中，请稍候…">向量化中…</span>`
      : doc.has_embeddings
        ? `<span class="doc-emb-badge ok" title="已向量化">向量</span>`
        : `<span class="doc-emb-badge no" title="TF-IDF 模式，点击重新向量化">TF-IDF</span>`;
    const reEmbBtn = (!doc.has_embeddings && !isEmbedding) ? `
      <button class="doc-re-embed" onclick="reEmbedDoc('${doc.doc_id}', this)" title="重新向量化">
        <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-4.09"/>
        </svg>
      </button>` : '';
    return `
    <div class="doc-item" title="${escapeHtml(doc.name)}">
      <span class="doc-icon">${icons[doc.file_type] || '📄'}</span>
      <span class="doc-name">${escapeHtml(doc.name)}</span>
      <span class="doc-chunks">${doc.chunk_count}块</span>
      ${embBadge}
      ${reEmbBtn}
      <button class="doc-delete" onclick="deleteDoc('${doc.doc_id}')"
        title="${isEmbedding ? '向量化中，暂不可删除' : '删除'}"
        ${isEmbedding ? 'disabled style="opacity:0.25;cursor:not-allowed;"' : ''}>
        <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>`;
  }).join('');
}

async function reEmbedDoc(docId, btn) {
  btn.style.opacity = '0.3';
  btn.disabled = true;
  try {
    const resp = await fetch(`${API_BASE}/api/documents/${docId}/re-embed`, {method: 'POST'});
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '向量化失败');
    showToast('✓ 向量化完成，已切换为 Embedding 检索', 'success');
    await loadDocuments();
  } catch (err) {
    showToast(err.message, 'error', 5000);
    btn.style.opacity = '';
    btn.disabled = false;
  }
}

async function uploadFile(file) {
  if (!file) return;

  const allowed = ['.txt', '.md', '.pdf', '.xlsx', '.xls'];
  const ext = '.' + file.name.split('.').pop().toLowerCase();
  if (!allowed.includes(ext)) {
    showToast(`不支持的文件格式: ${ext}，请使用 .txt、.md、.pdf、.xlsx 或 .xls`, 'error');
    return;
  }

  const progress = document.getElementById('upload-progress');
  progress.classList.add('visible');
  progress.textContent = `⏳ 正在处理 "${file.name}"…`;

  const form = new FormData();
  form.append('file', file);

  try {
    const resp = await fetch(`${API_BASE}/api/documents/upload`, {method: 'POST', body: form});
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '上传失败');
    showToast(`✓ "${file.name}" 导入成功，${data.chunk_count} 块，向量化进行中…`, 'success');
    // 加入后台向量化追踪，开始轮询
    state.embeddingDocs.add(data.doc_id);
    saveEmbeddingDocs();
    await loadDocuments();
    startEmbedPolling();
  } catch (err) {
    showToast(err.message, 'error', 5000);
  } finally {
    progress.classList.remove('visible');
    document.getElementById('file-input').value = '';
  }
}

async function deleteDoc(docId) {
  if (state.embeddingDocs.has(docId)) {
    showToast('向量化进行中，请稍候再删除', 'error');
    return;
  }
  try {
    const resp = await fetch(`${API_BASE}/api/documents/${docId}`, {method: 'DELETE'});
    if (!resp.ok) throw new Error('删除失败');
    showToast('文档已删除', 'info');
    state.embeddingDocs.delete(docId);  // 删除时同时移出轮询
    await loadDocuments();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

// ============================================================
// 后台向量化轮询
// ============================================================

const EMBED_PENDING_KEY = 'qa-embedding-pending';
const EMBED_MAX_AGE_MS  = 30 * 60 * 1000;  // 超过 30 分钟自动放弃

function saveEmbeddingDocs() {
  const now = Date.now();
  // 读取已有记录，只追加/更新本次
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem(EMBED_PENDING_KEY) || '{}'); } catch(e) {}
  for (const id of state.embeddingDocs) {
    if (!stored[id]) stored[id] = now;  // 记录首次加入时间
  }
  // 清理已不在 embeddingDocs 中的条目
  for (const id of Object.keys(stored)) {
    if (!state.embeddingDocs.has(id)) delete stored[id];
  }
  localStorage.setItem(EMBED_PENDING_KEY, JSON.stringify(stored));
}

function loadEmbeddingDocs() {
  try {
    const stored = JSON.parse(localStorage.getItem(EMBED_PENDING_KEY) || '{}');
    const now = Date.now();
    let changed = false;
    for (const [id, ts] of Object.entries(stored)) {
      if (now - ts < EMBED_MAX_AGE_MS) {
        state.embeddingDocs.add(id);
      } else {
        changed = true;  // 超时的条目，下面会被 saveEmbeddingDocs 清掉
      }
    }
    if (changed) saveEmbeddingDocs();
  } catch(e) {}
}

function startEmbedPolling() {
  if (state.embedPollTimer) return;  // 已在轮询中
  state.embedPollTimer = setInterval(async () => {
    if (state.embeddingDocs.size === 0) { stopEmbedPolling(); return; }
    try {
      const resp = await fetch(`${API_BASE}/api/documents`);
      if (!resp.ok) return;
      const docs = (await resp.json()).documents || [];
      const serverDocIds = new Set(docs.map(d => d.doc_id));

      for (const doc of docs) {
        if (state.embeddingDocs.has(doc.doc_id) && doc.has_embeddings) {
          state.embeddingDocs.delete(doc.doc_id);
          saveEmbeddingDocs();
          showToast(`✅ "${doc.name}" 向量化完成，已切换为语义检索`, 'success', 4000);
        }
      }
      // 文档已被删除的 doc_id 也停止追踪
      for (const pendingId of state.embeddingDocs) {
        if (!serverDocIds.has(pendingId)) {
          state.embeddingDocs.delete(pendingId);
          saveEmbeddingDocs();
        }
      }
      state.documents = docs;
      renderDocList();
      if (state.embeddingDocs.size === 0) stopEmbedPolling();
    } catch (e) { /* 网络波动忽略 */ }
  }, 6000);
}

function stopEmbedPolling() {
  if (state.embedPollTimer) {
    clearInterval(state.embedPollTimer);
    state.embedPollTimer = null;
  }
}

            border-radius: var(--radius-sm); color: var(--text-primary); font-size: 13px;
          "/>
          <div style="font-size: 10px; color: var(--text-muted); margin-top: 2px;">从列表接口的每条记录中提取标题，与 ID 字段同级（可选）</div>
        </div>
        <div style="margin-bottom: 12px;">
          <label style="display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px;">详情接口地址模板</label>
          <input id="detail-api-url" type="text" placeholder="https://api.example.com/detail/{id}" style="
            width: 100%; padding: 8px; background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text-primary); font-size: 13px;
          "/>
          <div style="font-size: 10px; color: var(--text-muted); margin-top: 2px;">使用 {id} 作为占位符</div>
        </div>
        <div style="margin-bottom: 12px;">
          <label style="display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px;">详情内容字段路径</label>
          <input id="detail-content-path" type="text" placeholder="例如：results.content" style="
            width: 100%; padding: 8px; background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text-primary); font-size: 13px;
          "/>
        </div>
      </div>

      <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button id="btn-save-source" style="
          flex: 1; padding: 8px; background: var(--accent); color: white; border: none;
          border-radius: var(--radius-sm); font-size: 13px; cursor: pointer;
        ">保存</button>
        <button id="btn-cancel-source" style="
          flex: 1; padding: 8px; background: var(--bg-hover); color: var(--text-primary); border: none;
          border-radius: var(--radius-sm); font-size: 13px; cursor: pointer;
        ">取消</button>
      </div>
    </div>
  `;

  document.body.appendChild(dialog);

  // 切换模式显示不同字段
  const typeSelect = dialog.querySelector('#source-type');
  const singleFields = dialog.querySelector('#single-mode-fields');
  const listDetailFields = dialog.querySelector('#list-detail-mode-fields');

  function switchMode(mode) {
    if (mode === 'single') {
      singleFields.style.display = 'block';
      listDetailFields.style.display = 'none';
    } else {
      singleFields.style.display = 'none';
      listDetailFields.style.display = 'block';
    }
  }

  typeSelect.onchange = () => switchMode(typeSelect.value);

  // 编辑模式：预填已有数据
  if (isEdit) {
    dialog.querySelector('#source-name').value = editSource.name || '';
    typeSelect.value = editSource.source_type || 'single';
    switchMode(editSource.source_type || 'single');

    if (editSource.source_type === 'single') {
      dialog.querySelector('#api-url').value = editSource.api_url || '';
      dialog.querySelector('#title-path').value = editSource.title_path || '';
      dialog.querySelector('#content-path').value = editSource.content_path || '';
    } else {
      dialog.querySelector('#list-api-url').value = editSource.list_api_url || '';
      dialog.querySelector('#list-id-path').value = editSource.list_id_path || '';
      dialog.querySelector('#list-title-path').value = editSource.list_title_path || '';
      dialog.querySelector('#detail-api-url').value = editSource.detail_api_url || '';
      dialog.querySelector('#detail-content-path').value = editSource.detail_content_path || '';
      dialog.querySelector('#transform-script').value = editSource.transform_script || '';
    }
  }

  dialog.querySelector('#btn-cancel-source').onclick = () => dialog.remove();
  dialog.querySelector('#btn-save-source').onclick = async () => {
    const name = dialog.querySelector('#source-name').value.trim();
    const sourceType = dialog.querySelector('#source-type').value;

    if (!name) {
      showToast('请输入数据源名称', 'error');
      return;
    }

    const payload = { name, source_type: sourceType, method: 'GET', timeout: 30 };

    if (sourceType === 'single') {
      payload.api_url = dialog.querySelector('#api-url').value.trim();
      payload.title_path = dialog.querySelector('#title-path').value.trim();
      payload.content_path = dialog.querySelector('#content-path').value.trim();
      if (!payload.api_url || !payload.content_path) {
        showToast('请填写完整的单接口配置', 'error');
        return;
      }
    } else {
      payload.list_api_url = dialog.querySelector('#list-api-url').value.trim();
      payload.list_id_path = dialog.querySelector('#list-id-path').value.trim();
      payload.list_title_path = dialog.querySelector('#list-title-path').value.trim();
      payload.detail_api_url = dialog.querySelector('#detail-api-url').value.trim();
      payload.detail_content_path = dialog.querySelector('#detail-content-path').value.trim();
      payload.transform_script = dialog.querySelector('#transform-script').value.trim();
      if (!payload.list_api_url || !payload.list_id_path || !payload.detail_api_url || !payload.detail_content_path) {
        showToast('请填写完整的列表+详情配置', 'error');
        return;
      }
    }

    try {
      let resp, data;
      if (isEdit) {
        // 编辑模式：调 PUT 接口
        resp = await fetch(`${API_BASE}/api/sources/${editSource.source_id}`, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload),
        });
        data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || '更新失败');
        showToast('数据源已更新', 'success');
      } else {
        // 新建模式：调 POST 接口
        resp = await fetch(`${API_BASE}/api/sources`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload),
        });
        data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || '创建失败');
        showToast('数据源创建成功', 'success');
      }
      dialog.remove();
      await loadApiSources();
    } catch (err) {
      showToast(err.message, 'error', 5000);
    }
  };

}

// ============================================================
// Event listeners
// ============================================================
function init() {
  loadChats();
  loadEmbeddingDocs();
  loadDocuments();
  loadApiSources();
  if (state.embeddingDocs.size > 0) startEmbedPolling();

  // If there's a saved active chat, render it; otherwise show welcome
  if (state.activeChatId && state.chats.find(c => c.id === state.activeChatId)) {
    renderSidebar();
    renderMessages();
  } else {
    state.activeChatId = null;
    renderSidebar();
    const welcome = document.getElementById('welcome-screen');
    if (welcome) welcome.style.display = 'flex';
  }

  // New chat button
  document.getElementById('btn-new-chat').onclick = () => { createNewChat(); };

  // Send button
  const sendBtn = document.getElementById('send-btn');
  sendBtn.onclick = sendMessage;

  // Input box
  const input = document.getElementById('chat-input');
  input.addEventListener('input', () => {
    autoResizeTextarea(input);
    updateSendButton(state.isStreaming);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (!state.isStreaming) sendMessage();
    }
  });

  // Suggestion chips
  document.getElementById('suggestion-chips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (chip) {
      input.value = chip.dataset.q;
      autoResizeTextarea(input);
      updateSendButton(false);
      sendMessage();
    }
  });

  // File upload
  document.getElementById('btn-upload-trigger').onclick = (e) => {
    e.stopPropagation();
    document.getElementById('file-input').click();
  };
  document.getElementById('file-input').onchange = e => {
    if (e.target.files[0]) uploadFile(e.target.files[0]);
  };

  // API数据源
  document.getElementById('btn-add-api-source').onclick = (e) => {
    e.stopPropagation();
    showApiSourceDialog();
  };

  // Mobile menu
  document.getElementById('mobile-menu-btn').onclick = () => {
    document.getElementById('sidebar').classList.toggle('open');
  };

  // Close sidebar on main click (mobile)
  document.querySelector('.main').addEventListener('click', () => {
    const sidebar = document.getElementById('sidebar');
    if (sidebar.classList.contains('open')) sidebar.classList.remove('open');
  });

  // Drag and drop
  let dragCounter = 0;
  document.addEventListener('dragenter', e => {
    if ([...e.dataTransfer.items].some(i => i.kind === 'file')) {
      dragCounter++;
      document.getElementById('drop-overlay').classList.add('active');
    }
  });
  document.addEventListener('dragleave', () => {
    dragCounter--;
    if (dragCounter <= 0) {
      dragCounter = 0;
      document.getElementById('drop-overlay').classList.remove('active');
    }
  });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    dragCounter = 0;
    document.getElementById('drop-overlay').classList.remove('active');
    const file = e.dataTransfer.files[0];
    if (file) uploadFile(file);
  });

  // ── 主题系统 ──────────────────────────────────────────────
  const systemMq = window.matchMedia('(prefers-color-scheme: dark)');

  function resolveTheme(id) {
    if (id === 'system') return systemMq.matches ? 'dark' : 'light';
    return id;
  }

  function applyTheme(id) {
    localStorage.setItem('qa-theme', id);
    document.documentElement.setAttribute('data-theme', resolveTheme(id));
    document.querySelectorAll('.theme-option').forEach(btn =>
      btn.classList.toggle('active', btn.dataset.theme === id)
    );
  }

  // 系统主题变化时自动跟随
  systemMq.addEventListener('change', () => {
    if (localStorage.getItem('qa-theme') === 'system') {
      document.documentElement.setAttribute('data-theme', resolveTheme('system'));
    }
  });

  // 恢复上次主题，默认跟随系统
  applyTheme(localStorage.getItem('qa-theme') || 'system');

  // 主题按钮开关
  const themeBtn    = document.getElementById('theme-btn');
  const themePicker = document.getElementById('theme-picker');
  themeBtn.addEventListener('click', e => {
    e.stopPropagation();
    themePicker.classList.toggle('open');
  });
  document.querySelectorAll('.theme-option').forEach(btn => {
    btn.addEventListener('click', () => {
      applyTheme(btn.dataset.theme);
      themePicker.classList.remove('open');
    });
  });
  document.addEventListener('click', () => themePicker.classList.remove('open'));

  // ── 侧栏折叠 ─────────────────────────────────────────────
  const sidebar   = document.getElementById('sidebar');
  const expandFab = document.getElementById('sidebar-expand-fab');

  function collapseSidebar() {
    if (window.innerWidth <= 640) return; // 移动端走 open/close
    sidebar.classList.add('collapsed');
    expandFab.classList.add('visible');
    localStorage.setItem('qa-sidebar-collapsed', '1');
  }
  function expandSidebar() {
    sidebar.classList.remove('collapsed');
    expandFab.classList.remove('visible');
    localStorage.removeItem('qa-sidebar-collapsed');
  }

  document.getElementById('sidebar-collapse-btn').addEventListener('click', collapseSidebar);
  expandFab.addEventListener('click', expandSidebar);

  // 恢复折叠状态
  if (localStorage.getItem('qa-sidebar-collapsed')) collapseSidebar();

  // ── 侧栏拖拽调宽 ──────────────────────────────────────────
  const resizer   = document.getElementById('sidebar-resizer');
  const MIN_W = 180, MAX_W = 480;

  function setSidebarWidth(w) {
    document.documentElement.style.setProperty('--sidebar-width', w + 'px');
    localStorage.setItem('qa-sidebar-width', w);
  }

  // 恢复上次宽度
  const savedW = parseInt(localStorage.getItem('qa-sidebar-width') || '0');
  if (savedW >= MIN_W && savedW <= MAX_W) setSidebarWidth(savedW);

  let isResizing = false;
  resizer.addEventListener('mousedown', e => {
    if (sidebar.classList.contains('collapsed')) return;
    isResizing = true;
    resizer.classList.add('dragging');
    document.body.style.cursor = 'ew-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!isResizing) return;
    const w = Math.max(MIN_W, Math.min(MAX_W, e.clientX));
    setSidebarWidth(w);
  });
  document.addEventListener('mouseup', () => {
    if (!isResizing) return;
    isResizing = false;
    resizer.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
}

// Run
init();
</script>
</body>
</html>
