name: Deploy to Server

on:
  push:
    branches:
      - master        # 只有 push 到 master 分支才触发
    paths-ignore:     # 这些文件变更不触发部署（节省次数）
      - '**.md'
      - '.gitignore'
      - '.env.example'

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. 拉取代码（用于后续检查，非必须但有利于 diff 日志）──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. SSH 登录服务器，执行更新脚本 ──
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     ${{ secrets.SERVER_PORT || '22' }}
          script_stop: true          # 任意步骤失败立即终止
          script: |
            set -e
            APP_DIR="/opt/qa-chat"
            SERVICE="qa-chat"

            echo "===== [1/4] 拉取最新代码 ====="
            cd "$APP_DIR"
            # 保留 .env 和 data/ 等本地文件，强制同步远程代码
            # 国内服务器访问 GitHub 不稳定，最多重试 3 次
            for i in 1 2 3; do
              git fetch origin master && break
              echo "git fetch 失败，第 $i 次重试（等待 10s）..."
              sleep 10
            done
            git reset --hard origin/master

            echo "===== [2/4] 安装/更新依赖 ====="
            .venv/bin/pip install -q --upgrade pip
            .venv/bin/pip install -q -r requirements.txt

            echo "===== [3/4] 重启服务 ====="
            systemctl restart "$SERVICE"

            echo "===== [4/4] 验证服务状态 ====="
            sleep 3
            systemctl is-active --quiet "$SERVICE" \
              && echo "✅ 服务运行正常" \
              || (echo "❌ 服务启动失败，查看日志：" && journalctl -u "$SERVICE" -n 30 --no-pager && exit 1)

      # ── 3. 部署结果通知（可选，失败时也会通知）──
      - name: Notify result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "🎉 部署成功！提交: ${{ github.sha }} by ${{ github.actor }}"
          else
            echo "💥 部署失败！提交: ${{ github.sha }} by ${{ github.actor }}"
          fi
