name: Deploy to Server

on:
  push:
    branches:
      - master        # 只有 push 到 master 分支才触发
    paths-ignore:     # 这些文件变更不触发部署（节省次数）
      - '**.md'
      - '.gitignore'
      - '.env.example'

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. 拉取代码 ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. 同步代码到服务器 ──
      - name: Sync files to server
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude='.env' --exclude='data/' --exclude='.git/' --exclude='.venv/'
          path: ./
          remote_path: /opt/qa-chat/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}
          remote_port: ${{ secrets.SERVER_PORT || '22' }}

      # ── 3. SSH 登录服务器，执行更新脚本 ──
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     ${{ secrets.SERVER_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            APP_DIR="/opt/qa-chat"
            SERVICE="qa-chat"

            echo "===== [1/3] 安装/更新依赖 ====="
            cd "$APP_DIR"
            .venv/bin/pip install -q --upgrade pip
            .venv/bin/pip install -q -r requirements.txt

            echo "===== [2/3] 重启服务 ====="
            systemctl restart "$SERVICE"

            echo "===== [3/3] 验证服务状态 ====="
            sleep 3
            systemctl is-active --quiet "$SERVICE" \
              && echo "✅ 服务运行正常" \
              || (echo "❌ 服务启动失败，查看日志：" && journalctl -u "$SERVICE" -n 30 --no-pager && exit 1)

      # ── 4. 部署结果通知 ──
      - name: Notify result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "🎉 部署成功！提交: ${{ github.sha }} by ${{ github.actor }}"
          else
            echo "💥 部署失败！提交: ${{ github.sha }} by ${{ github.actor }}"
          fi
